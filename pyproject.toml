[tool.ruff]
target-version = "py27"
line-length = 120
extend-exclude = ["plmn/__pycache__", "tests/__pycache__"]

[tool.ruff.lint]
# Py2 codebase — disable rules that flag idiomatic py2 (print stmt, except as, etc.)
ignore = ["E401", "E402", "E501", "E711", "E712", "E721", "E722", "F401", "F403", "F405", "UP"]
